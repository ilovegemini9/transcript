name: API tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  transcript-api:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Run serverless API tests
        run: node --test api/transcript.test.js api/ai.test.js
